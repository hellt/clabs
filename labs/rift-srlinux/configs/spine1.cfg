set / system ndk-server admin-state enable

# --- fabric links to the leaves ---
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "to leaf1"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.1.1.0/31

set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "to leaf2"
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.1.1.2/31

set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 description "to leaf3"
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.1.1.4/31

# --- loopback ---
set / interface system0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.0.0.1/32

# --- network-instance ---
set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface system0.0

# --- CPM ACLs for RIFT ---
# Without these entries the control plane drops RIFT packets and
# adjacencies never get past one-way.
set / acl acl-filter cpm type ipv4 entry 900 description "Accept incoming RIFT LIE"
set / acl acl-filter cpm type ipv4 entry 900 match ipv4 protocol udp
set / acl acl-filter cpm type ipv4 entry 900 match transport destination-port operator eq
set / acl acl-filter cpm type ipv4 entry 900 match transport destination-port value 914
set / acl acl-filter cpm type ipv4 entry 900 action accept

set / acl acl-filter cpm type ipv4 entry 901 description "Accept incoming RIFT TIE flood"
set / acl acl-filter cpm type ipv4 entry 901 match ipv4 protocol udp
set / acl acl-filter cpm type ipv4 entry 901 match transport destination-port operator eq
set / acl acl-filter cpm type ipv4 entry 901 match transport destination-port value 915
set / acl acl-filter cpm type ipv4 entry 901 action accept

# RIFT config (system-id, level, interfaces) is applied by deploy-rift.sh
# after the NDK agent is registered.
